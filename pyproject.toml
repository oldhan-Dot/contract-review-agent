[project]
name = "contract-review-agent"
version = "0.1.0"
description = "合同审批审查系统"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "sqlalchemy>=2.0.36,<3",
  "pymysql[rsa]>=1.1,<2",
  "alembic>=1.14,<2",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.12,<1",
  "python-docx>=1.1.2,<2",
  "pymupdf>=1.24,<2",
  "httpx>=0.27,<1",
  "langgraph>=0.2.50,<2",
  "loguru>=0.7,<1",
  "pyyaml>=6.0,<7",
  "openpyxl>=3.1,<4",
  "python-dotenv>=1.0,<2",
  "jinja2>=3.1,<4",
  "msoffcrypto-tool>=5.4,<6",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.7,<1", "respx>=0.21,<1"]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires the local MySQL database initialized by app.cli"]
